server:
  address: 0.0.0.0
  port: 8083
  servlet:
    session:
      timeout: 60m

logging:
  level:
    root: INFO
    org.springframework: DEBUG
    org.hibernate: DEBUG

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/university
    username: postgres
    password: pass

  mvc:
    hidden method:
      filter:
        enabled: true
  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
