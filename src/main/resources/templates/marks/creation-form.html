<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0"/>
  <title th:text="'Rate ' + ${studentFullName} + ' - University CMS'">Rate student - University CMS</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/tab-logo.svg}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:insert="~{fragments/header :: header}"></header>
<div class="container-fluid" style="max-width: 600px; margin: 0 auto;">
  <div class="row d-flex">
    <a class="fa fa-arrow-left col mt-3" th:href="@{/ui/v1/marks(sid=${studentId}, cid=${courseId}, fullName=${studentFullName})}"
       aria-hidden="true" title="Back to student marks"
       style="width: 100%; max-width: max-content; padding-left: 0; padding-right: 0; padding-top: 0.8rem; cursor: pointer; text-decoration: none; color: #0A0921"></a>
    <h2 class="title-center col mt-3" th:text="Rate + ' ' + ${studentFullName}"></h2>
  </div>
  <form th:method="post" th:action="@{/ui/v1/marks/create}" th:object="${mark}">
    <div class="form-group form-group-margin">
      <label class="form-control-label-margin" for="topicSelect" style="font-weight: bold">Select topic name</label>
      <select id="topicSelect" class="form-control" th:field="*{topicId}">
        <option th:each="topic : ${unratedTopics.entrySet()}"
                th:value="${topic.value}"
                th:text="${topic.key}"
                th:selected="${topic.key} == ${mark.topicName}">
        </option>
      </select>
      <div th:if="${#fields.hasErrors('topicId')}" th:errors="*{topicId}" class="invalid-validation"></div>
    </div>
    <div class="form-group form-group-margin">
      <label class="form-control-label-margin" for="markValue" style="font-weight: bold">Enter mark value</label>
      <input type="number" class="form-control" id="markValue" th:field="*{markValue}">
      <div th:if="${#fields.hasErrors('markValue')}" th:errors="*{markValue}" class="invalid-validation"></div>
    </div>
    <div class="form-group form-group-margin">
      <label class="form-control-label-margin" for="comment" style="font-weight: bold">Enter comment (not necessarily)</label>
      <input type="text" class="form-control" id="comment" th:field="*{comment}">
      <div th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}" class="invalid-validation"></div>
    </div>
    <input type="hidden" class="form-control" th:field="*{studentId}">
    <input type="hidden" name="cid" th:value="${courseId}">
    <input type="hidden" name="sid" th:value="${studentId}">
    <input type="hidden" name="fullName" th:value="${studentFullName}">
    <button sec:authorize="hasAuthority('MARKS_CREATE')" type="submit" id="rateButton"
            class="btn btn-success form-group-margin">Rate
    </button>
    <a th:href="@{../../../ui/v1/marks(sid=${studentId}, cid=${courseId}, fullName=${studentFullName})}"
       class="btn btn-secondary form-group-margin" style="margin-left: 20px">Cancel</a>
  </form>
</div>
<footer th:insert="~{fragments/footer :: footer}"></footer>
<script type="text/javascript" th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.min.js}"></script>
<script th:src="@{/webjars/jquery-ui/1.13.2/jquery-ui.min.js}"></script>
<script th:inline="javascript">
  const unratedTopics = /*[[${unratedTopics}]]*/ {};

  $(document).ready(function () {
    const topicNames = Object.keys(unratedTopics);
    const selectElement = document.getElementById('topicSelect');
    const rateButton = document.getElementById('rateButton');

    if (topicNames.length === 0) {
      selectElement.disabled = true;
      rateButton.disabled = true;
    }
  });
</script>
</body>
</html>
