<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0"/>
  <title th:text="${studentFullName} + ' - Marks - University CMS'">Student Marks - University CMS</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/tab-logo.svg}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:insert="~{fragments/header :: header}"></header>
<div class="container-fluid" style="max-width: 700px; margin: 0 auto;">
  <div class="row d-flex">
    <a class="fa fa-arrow-left col mt-3" th:href="@{/ui/v1/courses/my/{courseId}/students(courseId=${courseId})}"
       aria-hidden="true" title="Back to course students"
       style="width: 100%; max-width: max-content; padding-left: 0; padding-right: 0; padding-top: 0.8rem; cursor: pointer; text-decoration: none; color: #0A0921"></a>
    <h2 class="title-center col mt-3" th:text="${studentFullName} + ': marks'"></h2>
  </div>
  <div class="my-3">
    <form th:action="@{/ui/v1/marks}" id="searchForm">
      <div class="row d-flex">
        <div class="col-md-6 mt-2">
          <div class="search">
            <i class="fa fa-search"></i>
            <input type="hidden" name="sid" th:value="${studentId}">
            <input type="hidden" name="cid" th:value="${courseId}">
            <input type="hidden" name="fullName" th:value="${studentFullName}">
            <input id="keyword" type="search" name="keyword" th:value="${keyword}" required class="form-control"
                   placeholder="Enter topic name">
            <button type="submit" class="btn btn-primary">Search</button>
          </div>
        </div>
        <div class="col-md-3 mt-2 unsent-width">
          <button id="btnClear" class="btn btn-secondary">Clear</button>
        </div>
      </div>
    </form>
  </div>
  <div th:if="${marks.size()} > 0">
    <div class="table-container">
      <table class="table table-striped table-hover table-responsive-xl">
        <thead class="table-light">
        <tr>
          <th scope="col">№</th>
          <th scope="col" style="text-align: left">Topic name</th>
          <th scope="col">Mark</th>
          <th scope="col">Comment</th>
          <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="mark, interStat : ${marks}">
          <th scope="row" th:text="${interStat.count}"></th>
          <td th:text="*{mark.topicName}" style="text-align: left"></td>
          <td th:text="*{mark.markValue}"></td>
          <td>
            <span th:if="${mark.comment != null && mark.comment != ''}" th:text="*{mark.comment}"></span>
            <span th:unless="${mark.comment != null && mark.comment != ''}">-</span>
          </td>
          <td>
            <a sec:authorize="hasAuthority('MARKS_UPDATE')"
               th:href="@{/ui/v1/marks/{markId}/edit(markId=${mark.id}, sid=${studentId}, cid=${courseId}, fullName=${studentFullName})}"
               class="fa-regular fa-pen-to-square icon-dark" title="Edit this mark" style="text-decoration: none;"></a>
            <form sec:authorize="hasAuthority('MARKS_DELETE')" th:method="delete"
                  th:action="@{/ui/v1/marks/{markId}/delete(markId=${mark.id})}"
                  onclick="event.preventDefault(); this.submit();" style="margin-left: 10px; cursor: pointer;"
                  class="fa-regular fa-trash-can icon-dark btn-delete" title="Delete this mark">
              <input type="hidden" name="cid" th:value="${courseId}">
              <input type="hidden" name="sid" th:value="${studentId}">
              <input type="hidden" name="fullName" th:value="${studentFullName}">
              <input type="submit" style="display: none;">
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="message info-m" th:unless="${marks.size()} > 0">
    <span th:text="#{no.topic.rated}"></span>
  </div>
  <div class="row d-flex">
    <a sec:authorize="hasAuthority('MARKS_CREATE')" class="col-md-3 mt-2 unsent-width btn btn-success ms-auto"
       style="margin-right: 15px;"
       th:href="@{/ui/v1/marks/new(sid=${studentId}, cid=${courseId}, fullName=${studentFullName})}">Rate
      student</a>
  </div>
</div>
<footer th:insert="~{fragments/footer :: footer}"></footer>
<script type="text/javascript" th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.min.js}"></script>
<script th:src="@{/webjars/jquery-ui/1.13.2/jquery-ui.min.js}"></script>
<script th:inline="javascript">
  $(document).ready(function () {
    function clearAndRedirect(url) {
      $("#btnClear").on("click", function (e) {
        e.preventDefault();
        $("#keyword").text("");
        window.location = url;
      });
    }

    const url = /*[[@{/ui/v1/marks(sid=${studentId}, cid=${courseId}, fullName=${studentFullName})}]]*/ "";
    clearAndRedirect(url);

    const topicNames = /*[[${namesOfTopics}]]*/ [];

    $("#keyword").autocomplete({
      source: topicNames
    });
  });
</script>
</body>
</html>
