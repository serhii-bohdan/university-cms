<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0"/>
  <title>All Students - University CMS</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/tab-logo.svg}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:insert="~{fragments/header :: header}"></header>
<div class="container-fluid" style="max-width: 900px; margin: 0 auto;">
  <h2 class="title-center">Students</h2>
  <div class="my-3">
    <form th:action="@{/ui/v1/students}" id="searchForm">
      <div class="row d-flex">
        <div class="col-md-6 mt-2">
          <div class="search">
            <i class="fa fa-search"></i>
            <input id="keyword" type="search" name="keyword" th:value="${keyword}" required class="form-control"
                   placeholder="Enter student email">
            <button type="submit" class="btn btn-primary">Search</button>
          </div>
        </div>
        <div class="col-md-3 input-group mt-2">
          <div class="input-group-prepend">
            <label class="input-group-text" for="size">Items per page:</label>
          </div>
          <select form="searchForm" name="size" th:value="${size}" onchange="changePageSize()" class="size-select"
                  id="size">
            <option th:each="s : ${#numbers.sequence(1, 20)}" th:value="${s}" th:text="${s}"
                    th:selected="${s == size}"></option>
          </select>
        </div>
        <div class="col-md-3 mt-2 unsent-width">
          <button id="btnClear" class="btn btn-secondary">Clear</button>
        </div>
      </div>
    </form>
  </div>
  <div th:if="${students.size()} > 0">
    <table class="table table-striped table-hover table-responsive-xl">
      <thead class="table-light">
      <tr>
        <th scope="col">№</th>
        <th scope="col" style="text-align: left">Student name</th>
        <th scope="col" style="text-align: left">Email</th>
        <th scope="col">Group</th>
        <th scope="col">Status</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="student, interStat : ${students}">
        <th scope="row" th:text="${size * page + interStat.count}"></th>
        <td th:text="${student.firstName} + ' ' + ${student.lastName}" style="text-align: left"></td>
        <td th:text="${student.email}" style="text-align: left"></td>
        <td th:text="${student.groupName}"></td>
        <td>
          <span th:if="${student.isActive}" class="fa-regular fa-square-check icon-dark" title="Active"></span>
          <span th:unless="${student.isActive}" class="far fa-times-circle icon-dark" title="Not active"></span>
        </td>
        <td>
          <a sec:authorize="hasAuthority('STUDENTS_READ')"
             th:href="@{/ui/v1/students/{studentId}(studentId=${student.id})}" class="fa fa-eye icon-dark no-decoration"
             aria-hidden="true" title="View this student"></a>
          <a sec:authorize="hasAuthority('SCHEDULE_READ')" class="fas fa-calendar-alt icon-dark" aria-hidden="true"
             th:href="@{/ui/v1/schedule/{scheduleId}(scheduleId=${student.scheduleId}, userId=${student.id},
             userFullName=${student.firstName + ' ' + student.lastName}, userRole=${student.roleName},
             userLocationZoneOffset=${student.locationZoneOffset})}"
             title="View the student's schedule" style="text-decoration: none; margin-left: 5px;"></a>
          <a sec:authorize="hasAuthority('STUDENTS_UPDATE')" class="fa-regular fa-pen-to-square icon-dark"
             th:href="@{/ui/v1/students/{studentId}/edit(studentId=${student.id})}" title="Update student info"
             style="text-decoration: none; margin-left: 5px;"></a>
          <span sec:authorize="hasAuthority('STUDENTS_DELETE')" class="fa-regular fa-trash-can icon-dark btn-delete"
                title="Delete this student" style="margin-left: 5px; cursor: pointer;" data-bs-toggle="modal"
                data-bs-target="#studentDeleteModal" th:data-student-id="${student.id}"
                th:data-student-email="${student.email}"></span>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <div class="message info-m" th:unless="${students.size()} > 0">
    <span th:text="#{students.no.found}"></span>
  </div>
  <div class="my-3">
    <div class="row d-flex">
      <a sec:authorize="hasAuthority('STUDENTS_CREATE')" class="col-md-3 mt-2 unsent-width btn btn-success ms-auto"
         style="margin-right: 30px;" th:href="@{/ui/v1/students/new}">Add student</a>
    </div>
  </div>
  <div
    th:insert="~{fragments/pagination :: pagination('students', ${totalPages}, ${page}, ${size}, ${keyword})}"></div>
</div>
<div class="modal fade" id="studentDeleteModal" tabindex="-1" aria-labelledby="studentDeleteModalLabel"
     aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmModalLabel">Are you sure you want to delete this student?</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">By deleting this student, you will no longer be able to view information about him.</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <form th:method="delete" th:action="@{/ui/v1/students/studentId/delete}">
          <button type="submit" class="btn btn-danger">Delete</button>
        </form>
      </div>
    </div>
  </div>
</div>
<footer th:insert="~{fragments/footer :: footer}"></footer>
<script type="text/javascript" th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.min.js}"></script>
<script th:src="@{/webjars/jquery-ui/1.13.2/jquery-ui.min.js}"></script>
<script type="text/javascript" th:src="@{/js/script.js}"></script>
<script th:inline="javascript">
  $(document).ready(function () {
    function clearAndRedirect(url) {
      $("#btnClear").on("click", function (e) {
        e.preventDefault();
        $("#keyword").text("");
        window.location = url;
      });
    }

    clearAndRedirect("/ui/v1/students");

    const allEmailsOfStudents = /*[[${allEmailsOfStudents}]]*/ [];

    $("#keyword").autocomplete({
      source: allEmailsOfStudents
    });

    $('.btn-delete').click(function () {
      const studentId = $(this).data('student-id');
      const studentEmail = $(this).data('student-email');

      $('#studentDeleteModal .modal-title').text(`Are you sure you want to delete a student with a ${studentEmail} email?`);
      $('#studentDeleteModal form').attr('action', `/ui/v1/students/${studentId}/delete`);
    });
  });
</script>
</body>
</html>
