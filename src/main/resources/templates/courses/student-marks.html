<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0"/>
  <title>Marks</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:insert="~{fragments/header :: header}"></header>
<div class="container-fluid" style="max-width: 800px; margin: 0 auto;">
  <h2 class="title-center" th:text="${courseName} + ': marks'"></h2>
  <div class="my-3">
    <form th:action="@{/ui/v1/courses/my/{courseId}/marks(courseId=${courseId})}" id="searchForm">
      <div class="row d-flex">
        <div class="col-md-5 mt-2">
          <div class="search">
            <i class="fa fa-search"></i>
            <input type="hidden" name="courseName" th:value="${#strings.trim(courseName)}">
            <input id="keyword" type="search" name="keyword" th:value="${#strings.trim(keyword)}" required class="form-control" placeholder="Enter topic name">
            <button type="submit" class="btn btn-primary">Search</button>
          </div>
        </div>
        <div class="col-md-3 mt-2 unsent-width">
          <button id="btnClear" class="btn btn-secondary">Clear</button>
        </div>
      </div>
    </form>
  </div>
  <div>
    <a th:href="@{/ui/v1/courses/my/{courseId}(courseId=${courseId})}">Back to course</a>
  </div>
  <div th:if="${marks.size()} > 0">
    <table class="table table-striped table-hover table-responsive-xl">
      <thead class="table-light">
      <tr>
        <th scope="col">№</th>
        <th scope="col">Topic name</th>
        <th scope="col">Mark</th>
        <th scope="col">Comment</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="mark, interStat : ${marks}">
        <th scope="row" th:text="${interStat.count}"></th>
        <td th:text="*{mark.topic.topicName}"></td>
        <td th:text="*{mark.markValue}"></td>
        <td>
          <span th:if="${mark.comment} != null" th:text="*{mark.comment}"></span>
          <span th:unless="${mark.comment} != null">No comment</span>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <div class="message info-m" th:unless="${marks.size()} > 0">
    <span th:text="#{no.topic.rated}"></span>
  </div>
</div>
<footer th:insert="~{fragments/footer :: footer}"></footer>
<script type="text/javascript" th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.min.js}"></script>
<script th:src="@{/webjars/jquery-ui/1.13.2/jquery-ui.min.js}"></script>
<script type="text/javascript" th:src="@{/js/script.js}"></script>
<script th:inline="javascript">
  $(document).ready(function () {
    function clearAndRedirect(url) {
      $("#btnClear").on("click", function (e) {
        e.preventDefault();
        $("#keyword").text("");
        window.location = url;
      });
    }

    const url = /*[[@{/ui/v1/courses/my/{courseId}/marks(courseId=${courseId}, courseName=${courseName})}]]*/ "";
    clearAndRedirect(url);

    const topicNames = /*[[${namesOfTopics}]]*/ [];

    $("#keyword").autocomplete({
      source: topicNames
    });
  });
</script>
</body>
</html>
