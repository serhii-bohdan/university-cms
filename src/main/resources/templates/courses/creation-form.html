<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0"/>
  <title>Courses</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:insert="~{fragments/header :: header}"></header>
<div class="container-fluid" style="max-width: 600px; margin: 0 auto;">
  <h2 class="title-center">Create new course</h2>
  <form th:method="post" th:action="@{/ui/v1/courses/my/create}" th:object="${course}">
    <div class="form-group form-group-margin">
      <label class="form-control-label-margin" for="courseName">Enter course name</label>
      <input type="text" class="form-control" id="courseName" th:field="*{courseName}">
      <div th:if="${#fields.hasErrors('courseName')}" th:errors="*{courseName}" class="invalid-validation"></div>
    </div>
    <div class="form-group form-group-margin">
      <label class="form-control-label-margin" for="courseDescription">Describe the course</label>
      <textarea class="form-control" id="courseDescription" th:field="*{courseDescription}" rows="6"></textarea>
      <div th:if="${#fields.hasErrors('courseDescription')}" th:errors="*{courseDescription}" class="invalid-validation"></div>
    </div>
    <input type="hidden" class="form-control" th:field="*{authorId}">
    <button sec:authorize="hasAuthority('COURSES_CREATE')" type="submit" class="btn btn-success form-group-margin" th:text="Create"></button>
    <a class="btn btn-secondary form-group-margin" style="margin-left: 20px" th:href="@{../../../../ui/v1/courses/my}" th:text="Cancle"></a>
  </form>
</div>
<div th:insert="~{fragments/error-modal :: errorModal(${validationErrorMessage})}"></div>
<footer th:insert="~{fragments/footer :: footer}"></footer>
<script type="text/javascript" th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.min.js}"></script>
<script th:src="@{/webjars/jquery-ui/1.13.2/jquery-ui.min.js}"></script>
<script th:inline="javascript">
  $(document).ready(function () {
    const message = /*[[${validationErrorMessage}]]*/ null;

    if (message !== null ) {
      const modal = $('#errorModal');
      modal.modal('show');
    }
  });
</script>
</body>
</html>
