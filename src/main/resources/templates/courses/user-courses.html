<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0"/>
  <title>Courses</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:insert="~{fragments/header :: header}"></header>
<div class="container-fluid" style="max-width: 800px; margin: 0 auto;">
  <h2 class="title-center">My courses</h2>
  <div class="my-3">
    <form th:action="@{/ui/v1/courses/my}" id="searchForm">
      <div class="row d-flex">
        <div class="col-md-6 mt-2">
          <div class="search">
            <i class="fa fa-search"></i>
            <input id="keyword" type="search" name="keyword" th:value="${keyword}" required
                   class="form-control" placeholder="Enter course name">
            <button type="submit" class="btn btn-primary">Search</button>
          </div>
        </div>
        <div class="col-md-3 mt-2 unsent-width">
          <button id="btnClear" class="btn btn-secondary">Clear</button>
        </div>
      </div>
    </form>
  </div>
  <div class="my-2">
    <div class="row d-flex">
      <a class="col-md-3 mt-2 unsent-width btn btn-light btn-light-cus" th:href="@{/ui/v1/courses}"
         style="margin-left: 12px;">All courses</a>
      <a sec:authorize="hasAuthority('COURSES_CREATE')" class="col-md-3 mt-2 unsent-width btn btn-success ms-auto"
         style="margin-right: 30px;" th:href="@{/ui/v1/courses/my/new}">Create course</a>
    </div>
  </div>
  <div th:if="${userCourses.size()} > 0">
    <div class="table-container">
      <table class="table table-striped table-hover table-responsive-xl">
        <thead class="table-light">
        <tr>
          <th scope="col">№</th>
          <th scope="col">Course name</th>
          <th scope="col">Author name</th>
          <th scope="col">Number of topics</th>
          <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course, interStat : ${userCourses}">
          <th scope="row" th:text="${interStat.count}"></th>
          <td th:text="*{course.courseName}"></td>
          <td th:text="*{course.authorFirstName + ' ' + course.authorLastName}"></td>
          <td th:text="*{course.topics.size()}"></td>
          <td>
            <a sec:authorize="hasAuthority('COURSES_READ')"
               th:href="@{/ui/v1/courses/my/{courseId}(courseId=${course.id})}"
               class="fa fa-eye icon-dark no-decoration" aria-hidden="true" title="View this course"></a>
            <a sec:authorize="hasAuthority('COURSES_UPDATE')"
               th:href="@{/ui/v1/courses/my/{courseId}/edit(courseId=${course.id})}"
               class="fa-regular fa-pen-to-square icon-dark" title="Edit this course"
               style="text-decoration: none; margin-left: 10px;"></a>
            <span sec:authorize="hasAuthority('COURSES_DELETE')" style="margin-left: 10px; cursor: pointer;"
                  class="fa-regular fa-trash-can icon-dark btn-delete" title="Delete this course"
                  data-bs-toggle="modal" data-bs-target="#courseDeleteModal" th:data-course-id="${course.id}"
                  th:data-course-name="${course.courseName}">
            </span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="message info-m" th:unless="${userCourses.size()} > 0">
    <span th:text="#{courses.no.found}"></span>
  </div>
</div>
<div class="modal fade" id="courseDeleteModal" tabindex="-1" aria-labelledby="courseDeleteModalLabel"
     aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmModalLabel">Are you sure you want to delete this course?</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">By deleting this course you will remove all topics it contains.</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <form th:method="delete" th:action="@{/ui/v1/courses/my/courseId/delete}">
          <button type="submit" class="btn btn-danger">Delete</button>
        </form>
      </div>
    </div>
  </div>
</div>
<footer th:insert="~{fragments/footer :: footer}"></footer>
<script type="text/javascript" th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.min.js}"></script>
<script th:src="@{/webjars/jquery-ui/1.13.2/jquery-ui.min.js}"></script>
<script th:inline="javascript">
  $(document).ready(function () {
    function clearAndRedirect(url) {
      $("#btnClear").on("click", function (e) {
        e.preventDefault();
        $("#keyword").text("");
        window.location = url;
      });
    }

    clearAndRedirect("/ui/v1/courses/my");

    const courseNames = /*[[${userCoursesNames}]]*/ [];

    $("#keyword").autocomplete({
      source: courseNames
    });

    $('.btn-delete').click(function () {
      const courseId = $(this).data('course-id');
      const courseName = $(this).data('course-name');

      $('#courseDeleteModal .modal-title').text(`Are you sure you want to delete the ${courseName} course?`);
      $('#courseDeleteModal form').attr('action', `/ui/v1/courses/my/${courseId}/delete`);
    });
  });
</script>
</body>
</html>
