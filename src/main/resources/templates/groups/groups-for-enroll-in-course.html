<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0"/>
  <title>Choose Group for Enrollment - University CMS</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/tab-logo.svg}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:insert="~{fragments/header :: header}"></header>
<div class="container-fluid" style="max-width: 750px; margin: 0 auto;">
  <div class="row d-flex">
    <a class="fa fa-arrow-left col mt-3" th:href="@{/ui/v1/courses/my/{courseId}/students(courseId=${courseId})}"
       aria-hidden="true" title="Back to course students"
       style="width: 100%; max-width: max-content; padding-left: 0; padding-right: 0; padding-top: 0.8rem; cursor: pointer; text-decoration: none; color: #0A0921"></a>
    <h3 class="title-center col mt-3">Select a group to enroll in the course</h3>
  </div>
  <div class="my-3">
    <form th:action="@{/ui/v1/groups/for-enroll}" id="searchForm">
      <div class="row d-flex">
        <div class="col-md-6 mt-2">
          <div class="search">
            <i class="fa fa-search"></i>
            <input id="keyword" type="search" name="keyword" th:value="${keyword}" required class="form-control"
                   placeholder="Enter group name">
            <input type="hidden" name="cid" th:value="${courseId}">
            <button type="submit" class="btn btn-primary">Search</button>
          </div>
        </div>
        <div class="col-md-3 mt-2 unsent-width">
          <button id="btnClear" class="btn btn-secondary">Clear</button>
        </div>
      </div>
    </form>
  </div>
  <div th:if="${groups.size()} > 0">
    <div class="table-container">
      <table class="table table-striped table-hover table-responsive-xl">
        <thead class="table-light">
        <tr>
          <th scope="col">№</th>
          <th scope="col">Group name</th>
          <th scope="col">Number of students</th>
          <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="group, interStat : ${groups}">
          <th scope="row" th:text="${interStat.count}"></th>
          <td th:text="*{group.groupName}"></td>
          <td th:text="*{group.students.size()}"></td>
          <td>
            <form sec:authorize="hasAuthority('COURSES_UPDATE')" th:method="post"
                  th:action="@{/ui/v1/courses/my/{courseId}/group/{groupId}/enroll(groupId=${group.id}, courseId=${courseId})}">
              <button type="submit" class="btn btn-success">Enroll</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="message info-m" th:unless="${groups.size()} > 0">
    <span th:text="#{groups.no.found}"></span>
  </div>
</div>
<footer th:insert="~{fragments/footer :: footer}"></footer>
<script type="text/javascript" th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.min.js}"></script>
<script th:src="@{/webjars/jquery-ui/1.13.2/jquery-ui.min.js}"></script>
<script th:inline="javascript">
  $(document).ready(function () {
    function clearAndRedirect(url) {
      $("#btnClear").on("click", function (e) {
        e.preventDefault();
        $("#keyword").text("");
        window.location = url;
      });
    }

    const courseId = /*[[${courseId}]]*/ null;
    const defaultUrl = "/ui/v1/groups/for-enroll?cid=" + courseId;
    clearAndRedirect(defaultUrl);

    const allNamesOfGroups = /*[[${allNamesOfGroups}]]*/ [];

    $("#keyword").autocomplete({
      source: allNamesOfGroups
    });
  });
</script>
</body>
</html>
