<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0"/>
  <title>All Admins List – University CMS</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/tab-logo.svg}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:insert="~{fragments/header :: header}"></header>
<div class="container-fluid" style="max-width: 750px; margin: 0 auto;">
  <h2 class="title-center">Admins</h2>
  <div class="my-3">
    <form th:action="@{/ui/v1/admins}" id="searchForm">
      <div class="row d-flex">
        <div class="col-md-6 mt-2">
          <div class="search">
            <i class="fa fa-search"></i>
            <input id="keyword" type="search" name="keyword" th:value="${keyword}" required
                   class="form-control" placeholder="Enter admin email">
            <button type="submit" class="btn btn-primary">Search</button>
          </div>
        </div>
        <div class="col-md-3 input-group mt-2">
          <div class="input-group-prepend">
            <label class="input-group-text" for="size">Items per page:</label>
          </div>
          <select form="searchForm" name="size" th:value="${size}" onchange="changePageSize()" class="size-select"
                  id="size">
            <option th:each="s : ${#numbers.sequence(1, 20)}" th:value="${s}" th:text="${s}"
                    th:selected="${s == size}"></option>
          </select>
        </div>
        <div class="col-md-3 mt-2 unsent-width">
          <button id="btnClear" class="btn btn-secondary">Clear</button>
        </div>
      </div>
    </form>
  </div>
  <div th:if="${admins.size()} > 0">
    <table class="table table-striped table-hover table-responsive-xl">
      <thead class="table-light">
      <tr>
        <th scope="col">№</th>
        <th scope="col" style="text-align: left">Admin name</th>
        <th scope="col" style="text-align: left">Email</th>
        <th
          sec:authorize="hasAuthority('ADMINS_READ') && hasAuthority('ADMINS_UPDATE') && hasAuthority('ADMINS_DELETE')"
          scope="col">Actions
        </th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="admin, interStat : ${admins}">
        <th scope="row" th:text="${size * page + interStat.count}"></th>
        <td th:text="${admin.firstName} + ' ' + ${admin.lastName}" style="text-align: left"></td>
        <td th:text="${admin.email}" style="text-align: left"></td>
        <td>
          <a sec:authorize="hasAuthority('ADMINS_READ')" class="fa fa-eye icon-dark no-decoration" aria-hidden="true"
             th:href="@{/ui/v1/admins/{adminId}(adminId=${admin.id})}" title="View this admin"></a>
          <a sec:authorize="hasAuthority('ADMINS_UPDATE')" class="fa-regular fa-pen-to-square icon-dark"
             th:href="@{/ui/v1/admins/{adminId}/edit(adminId=${admin.id})}" title="Update admin info"
             style="text-decoration: none; margin-left: 5px;"></a>
          <span sec:authorize="hasAuthority('ADMINS_DELETE')" class="fa-regular fa-trash-can icon-dark btn-delete"
                title="Delete this admin" style="margin-left: 5px; cursor: pointer;" data-bs-toggle="modal"
                data-bs-target="#adminDeleteModal" th:data-admin-id="${admin.id}"
                th:data-admin-email="${admin.email}"></span>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <div class="message info-m" th:unless="${admins.size()} > 0">
    <span th:text="#{admins.no.found}"></span>
  </div>
  <div class="my-3">
    <div class="row d-flex">
      <a sec:authorize="hasAuthority('ADMINS_CREATE')" class="col-md-3 mt-2 unsent-width btn btn-success ms-auto"
         style="margin-right: 30px;" th:href="@{/ui/v1/admins/new}">Add admin</a>
    </div>
  </div>
  <div
    th:insert="~{fragments/pagination :: pagination('admins', ${totalPages}, ${page}, ${size}, ${keyword})}"></div>
</div>
<div class="modal fade" id="adminDeleteModal" tabindex="-1" aria-labelledby="adminDeleteModalLabel"
     aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmModalLabel">Are you sure you want to delete this admin?</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">This administrator will lose the ability to manage managers in the system.</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <form th:method="delete" th:action="@{/ui/v1/admins/adminId/delete}">
          <button type="submit" class="btn btn-danger">Delete</button>
        </form>
      </div>
    </div>
  </div>
</div>
<footer th:insert="~{fragments/footer :: footer}"></footer>
<script type="text/javascript" th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.min.js}"></script>
<script th:src="@{/webjars/jquery-ui/1.13.2/jquery-ui.min.js}"></script>
<script type="text/javascript" th:src="@{/js/script.js}"></script>
<script th:inline="javascript">
  $(document).ready(function () {
    function clearAndRedirect(url) {
      $("#btnClear").on("click", function (e) {
        e.preventDefault();
        $("#keyword").text("");
        window.location = url;
      });
    }

    clearAndRedirect("/ui/v1/admins");

    const allEmailsOfAdmins = /*[[${allEmailsOfAdmins}]]*/ [];

    $("#keyword").autocomplete({
      source: allEmailsOfAdmins
    });

    $('.btn-delete').click(function () {
      const adminId = $(this).data('admin-id');
      const adminEmail = $(this).data('admin-email');

      $('#adminDeleteModal .modal-title').text(`Are you sure you want to delete the admin with a ${adminEmail} email?`);
      $('#adminDeleteModal form').attr('action', `/ui/v1/admins/${adminId}/delete`);
    });
  });
</script>
</body>
</html>
