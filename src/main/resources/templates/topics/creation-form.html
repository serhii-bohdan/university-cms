<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0"/>
  <title>Add Topic to Course - University CMS</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/tab-logo.svg}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:insert="~{fragments/header :: header}"></header>
<div class="container-fluid" style="max-width: 600px; margin: 0 auto;">
  <div class="row d-flex">
    <a class="fa fa-arrow-left col mt-3" th:href="@{/ui/v1/courses/my/{courseId}(courseId=${topic.courseId})}"
       aria-hidden="true" title="Back to course"
       style="width: 100%; max-width: max-content; padding-left: 0; padding-right: 0; padding-top: 0.8rem; cursor: pointer; text-decoration: none; color: #0A0921"></a>
    <h2 class="title-center col mt-3">Add new topic to course</h2>
  </div>
  <form th:method="post" th:action="@{/ui/v1/topics/create}" th:object="${topic}">
    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
      <ul style="margin-bottom: 0">
        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
      </ul>
    </div>
    <div class="form-group form-group-margin">
      <label class="form-control-label-margin" for="topicName" style="font-weight: bold">Enter topic name</label>
      <input type="text" class="form-control" id="topicName" th:field="*{topicName}">
      <div th:if="${#fields.hasErrors('topicName')}" th:errors="*{topicName}" class="invalid-validation"></div>
    </div>
    <div class="form-group form-group-margin">
      <label class="form-control-label-margin" for="topicDescription" style="font-weight: bold">Describe the topic</label>
      <textarea class="form-control" id="topicDescription" th:field="*{topicDescription}" rows="5"></textarea>
      <div th:if="${#fields.hasErrors('topicDescription')}" th:errors="*{topicDescription}"
           class="invalid-validation"></div>
    </div>
    <div class="form-group form-group-margin">
      <label class="form-control-label-margin" for="topicOrder" style="font-weight: bold">Enter topic order</label>
      <input type="number" class="form-control" id="topicOrder" th:field="*{topicOrder}">
      <div th:if="${#fields.hasErrors('topicOrder')}" th:errors="*{topicOrder}" class="invalid-validation"></div>
    </div>
    <input type="hidden" class="form-control" th:field="*{courseId}">
    <button sec:authorize="hasAuthority('TOPICS_CREATE')" type="submit" class="btn btn-success form-group-margin">Add
    </button>
    <a th:href="@{../../../ui/v1/courses/my/{courseId}(courseId=${topic.courseId})}" style="margin-left: 20px"
       class="btn btn-secondary form-group-margin">Cancel</a>
  </form>
</div>
<footer th:insert="~{fragments/footer :: footer}"></footer>
<script type="text/javascript" th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.min.js}"></script>
<script th:src="@{/webjars/jquery-ui/1.13.2/jquery-ui.min.js}"></script>
</body>
</html>
