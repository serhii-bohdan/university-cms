<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0"/>
  <title>Study Day</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:insert="~{fragments/header :: header}"></header>
<div class="container-fluid" style="max-width: 800px; margin: 0 auto;">
  <h2 class="title-center"
      th:text="${studyDay.date.getDayOfMonth()} + ' ' + ${studyDay.date.getMonth().name().toLowerCase()} + ' ' + ${studyDay.date.getYear()}"></h2>
  <div th:if="${studyDay.id} != null">
    <div class="my-3">
      <div class="row d-flex">
        <div class="col-md-3 mt-2 unsent-width">
          <a sec:authorize="hasAuthority('STUDY_DAYS_CREATE')" class="btn btn-success" href="#">Schedule a lesson</a>
        </div>
      </div>
    </div>
    <div th:if="${studyDay.lessons.size()} > 0">
      <h4 style="margin-top: 15px; text-align: center !important;">Lessons</h4>
      <table class="table table-striped table-hover table-responsive-xl">
        <thead class="table-light">
        <tr>
          <th scope="col">№</th>
          <th scope="col">Start Time</th>
          <th scope="col">End Time</th>
          <th scope="col">Time Zone</th>
          <th scope="col">Course name</th>
          <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="lesson, interStat : ${studyDay.lessons}">
          <th th:text="${interStat.count}"></th>
          <td th:text="${lesson.lessonStartTime}"></td>
          <td th:text="${lesson.lessonEndTime}"></td>
          <td th:text="${#strings.replace(lesson.timezone, '_', ' ')}"></td>
          <td th:text="${lesson.course.courseName}"></td>
          <td>
            <a sec:authorize="hasAuthority('LESSONS_UPDATE')" href="#" class="fa-regular fa-pen-to-square icon-dark"
               title="Update teacher info" style="text-decoration: none; margin-left: 10px;"></a>
            <a sec:authorize="hasAuthority('LESSONS_DELETE')" href="#" class="fa-regular fa-trash-can icon-dark btn-delete"
               title="Delete this teacher" style="margin-left: 10px;"></a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="message info-m" th:unless="${studyDay.lessons.size()} > 0">
      <span th:text="#{no.events.planned}"></span>
    </div>
  </div>
  <div class="message info-m" th:unless="${studyDay.id} != null" style="flex-direction: column">
    <span th:text="#{not.scheduled}"></span>
    &nbsp;
    <form action="#" th:method="post" th:object="${studyDay}">
      <button class="btn btn-success" type="submit">Schedule this day</button>
    </form>
  </div>
</div>
<footer th:insert="~{fragments/footer :: footer}"></footer>
<script type="text/javascript" th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.min.js}"></script>
<script th:src="@{/webjars/jquery-ui/1.13.2/jquery-ui.min.js}"></script>
<script type="text/javascript" th:src="@{/js/script.js}"></script>
</body>
</html>
