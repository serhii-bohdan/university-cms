<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0"/>
  <title>Study Day</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:insert="~{fragments/header :: header}"></header>
<div class="container-fluid" style="max-width: 800px; margin: 0 auto;">
  <div class="row d-flex">
    <i class="fa fa-arrow-left col mt-3" aria-hidden="true" title="Back to schedule" onclick="history.back()"
       style="width: 100%; max-width: max-content; padding-left: 0; padding-right: 0; padding-top: 0.8rem; cursor: pointer;"></i>
    <h2 class="title-center col mt-3"
        th:text="${studyDay.date.getDayOfMonth()} + ' ' + ${studyDay.date.getMonth().name().toLowerCase()} + ' ' + ${studyDay.date.getYear()}"></h2>
  </div>
  <div th:if="${studyDay.id} != null">
    <div th:if="${studyDay.lessons.size()} > 0">
      <h4 style="margin-top: 15px; text-align: center !important;">Lessons</h4>
      <table class="table table-striped table-hover table-responsive-xl">
        <thead class="table-light">
        <tr>
          <th scope="col">№</th>
          <th scope="col">Start Time</th>
          <th scope="col">End Time</th>
          <th scope="col">Time Zone</th>
          <th scope="col">Course name</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="lesson, interStat : ${studyDay.lessons}">
          <th th:text="${interStat.count}"></th>
          <td th:text="${(lesson.lessonStartTime.getHour() >= 10 ? lesson.lessonStartTime.getHour() : '0' + lesson.lessonStartTime.getHour()) + ':' + (lesson.lessonStartTime.getMinute() >= 10 ? lesson.lessonStartTime.getMinute() : '0' + lesson.lessonStartTime.getMinute())}"></td>
          <td th:text="${(lesson.lessonEndTime.getHour() >= 10 ? lesson.lessonEndTime.getHour() : '0' + lesson.lessonEndTime.getHour()) + ':' + (lesson.lessonEndTime.getMinute() >= 10 ? lesson.lessonEndTime.getMinute() : '0' + lesson.lessonEndTime.getMinute())}"></td>
          <td th:text="${#strings.replace(lesson.timezone, '_', ' ')}"></td>
          <td th:text="${lesson.course.courseName}"></td>
        </tr>
        </tbody>
      </table>
      <div class="my-3">
        <div class="row d-flex">
          <div class="col-md-3 mt-2 unsent-width">
            <p th:text="#{lessons.scheduled.in.past}"></p>
          </div>
        </div>
      </div>
    </div>
    <div th:unless="${studyDay.lessons.size()} > 0" class="message info-m">
      <span th:text="#{no.lessons.planned.in.past}"></span>
    </div>
  </div>
  <div th:unless="${studyDay.id} != null" class="message info-m" style="flex-direction: column">
    <span th:text="#{not.scheduled.in.past}"></span>
  </div>
</div>
<footer th:insert="~{fragments/footer :: footer}"></footer>
<script type="text/javascript" th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.min.js}"></script>
<script th:src="@{/webjars/jquery-ui/1.13.2/jquery-ui.min.js}"></script>
</body>
</html>
