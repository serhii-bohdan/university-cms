<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0"/>
  <title>Study Day</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:insert="~{fragments/header :: header}"></header>
<div class="container-fluid" style="max-width: 800px; margin: 0 auto;">
  <div class="row d-flex">
    <a class="fa fa-arrow-left col mt-3" th:href="@{/ui/v1/schedule}" aria-hidden="true" title="Back to schedule"
       style="width: 100%; max-width: max-content; padding-left: 0; padding-right: 0; padding-top: 0.8rem; cursor: pointer; text-decoration: none; color: #0A0921"></a>
    <h2 class="title-center col mt-3"
        th:text="${studyDay.date.getDayOfMonth() + ' ' + studyDay.date.getMonth().name().toLowerCase() + ' ' + studyDay.date.getYear()}"></h2>
  </div>
  <div th:if="${studyDay.id} != null">
    <div class="my-3">
      <div class="row d-flex">
        <div class="col-md-3 mt-2 unsent-width">
          <a sec:authorize="hasAuthority('STUDY_DAYS_CREATE')" class="btn btn-success"
             th:href="@{/ui/v1/lessons/new(studyDayId=${studyDay.id}, date=${studyDay.date}, scheduleId=${studyDay.scheduleId})}">Schedule
            a lesson</a>
        </div>
      </div>
    </div>
    <div th:if="${studyDay.lessons.size()} > 0">
      <h4 style="margin-top: 15px; text-align: center !important;">Lessons</h4>
      <table class="table table-striped table-hover table-responsive-xl">
        <thead class="table-light">
        <tr>
          <th scope="col">№</th>
          <th scope="col">Start Time</th>
          <th scope="col">End Time</th>
          <th scope="col">Time Zone</th>
          <th scope="col">Course name</th>
          <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="lesson, interStat : ${studyDay.lessons}">
          <th th:text="${interStat.count}"></th>
          <td
            th:text="${(lesson.lessonStartTime.getHour() >= 10 ? lesson.lessonStartTime.getHour() : '0' + lesson.lessonStartTime.getHour()) + ':' + (lesson.lessonStartTime.getMinute() >= 10 ? lesson.lessonStartTime.getMinute() : '0' + lesson.lessonStartTime.getMinute())}"></td>
          <td
            th:text="${(lesson.lessonEndTime.getHour() >= 10 ? lesson.lessonEndTime.getHour() : '0' + lesson.lessonEndTime.getHour()) + ':' + (lesson.lessonEndTime.getMinute() >= 10 ? lesson.lessonEndTime.getMinute() : '0' + lesson.lessonEndTime.getMinute())}"></td>
          <td th:text="${#strings.replace(lesson.timezone, '_', ' ')}"></td>
          <td th:text="${lesson.course.courseName}"></td>
          <td>
            <a sec:authorize="hasAuthority('LESSONS_UPDATE')"
               th:href="@{/ui/v1/lessons/{lessonId}/edit(lessonId=${lesson.id}, date=${studyDay.date}, scheduleId=${studyDay.scheduleId})}"
               class="fa-regular fa-pen-to-square icon-dark" style="text-decoration: none; margin-left: 10px;"
               title="Update lesson info"></a>
            <form sec:authorize="hasAuthority('LESSONS_DELETE')" th:method="delete"
                  th:action="@{/ui/v1/lessons/{lessonId}/delete(lessonId=${lesson.id}, date=${studyDay.getDate()}, scheduleId=${studyDay.getScheduleId()})}"
                  onclick="event.preventDefault(); this.submit();" style="margin-left: 10px; cursor: pointer;"
                  class="fa-regular fa-trash-can icon-dark btn-delete" title="Delete this lesson"></form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="message info-m" th:unless="${studyDay.lessons.size()} > 0">
      <span th:text="#{no.lessons.planned}"></span>
    </div>
  </div>
  <div class="message info-m" th:unless="${studyDay.id} != null" style="flex-direction: column">
    <span th:text="#{not.scheduled}"></span>
    &nbsp;
    <form th:action="@{/ui/v1/study-days/add}" th:method="post" th:object="${studyDay}">
      <input type="hidden" th:field="*{date}">
      <input type="hidden" th:field="*{weekDay}">
      <input type="hidden" th:field="*{scheduleId}">
      <button class="btn btn-success" type="submit">Schedule this day</button>
    </form>
    <div class="mt-3" th:object="${studyDay}">
      <div th:if="${#fields.hasErrors('date')}" th:errors="*{date}" class="invalid-validation"></div>
      <div th:if="${#fields.hasErrors('weekDay')}" th:errors="*{weekDay}" class="invalid-validation"></div>
      <div th:if="${#fields.hasErrors('scheduleId')}" th:errors="*{scheduleId}" class="invalid-validation"></div>
      <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
        <ul style="margin-bottom: 0">
          <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
        </ul>
      </div>
    </div>
  </div>
</div>
<footer th:insert="~{fragments/footer :: footer}"></footer>
<script type="text/javascript" th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.min.js}"></script>
<script th:src="@{/webjars/jquery-ui/1.13.2/jquery-ui.min.js}"></script>
</body>
</html>
