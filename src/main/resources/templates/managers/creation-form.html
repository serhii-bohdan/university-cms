<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6" xmlns="http://www.w3.org/1999/html">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0"/>
  <title>Add New Manager - University CMS</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/tab-logo.svg}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:insert="~{fragments/header :: header}"></header>
<div class="container-fluid" style="max-width: 600px; margin: 0 auto;">
  <div class="row d-flex">
    <a class="fa fa-arrow-left col mt-3" th:href="@{/ui/v1/managers}" aria-hidden="true"
       title="Back to the list of managers"
       style="width: 100%; max-width: max-content; padding-left: 0; padding-right: 0; padding-top: 0.8rem; cursor: pointer; text-decoration: none; color: #0A0921"></a>
    <h2 class="title-center col mt-3">Add a new manager</h2>
  </div>
  <form th:method="post" th:action="@{/ui/v1/managers/add}" th:object="${manager}">
    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
      <ul style="margin-bottom: 0">
        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
      </ul>
    </div>
    <div class="form-group form-group-margin">
      <label class="form-control-label-margin" for="firstName" style="font-weight: bold">Enter manager first name</label>
      <input type="text" class="form-control" id="firstName" th:field="*{firstName}">
      <div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="invalid-validation"></div>
    </div>
    <div class="form-group form-group-margin">
      <label class="form-control-label-margin" for="lastName" style="font-weight: bold">Enter manager last name</label>
      <input type="text" class="form-control" id="lastName" th:field="*{lastName}">
      <div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="invalid-validation"></div>
    </div>
    <div class="form-group form-group-margin">
      <label class="form-control-label-margin" for="email" style="font-weight: bold">Enter manager email</label>
      <input type="email" class="form-control" id="email" th:field="*{email}">
      <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="invalid-validation"></div>
    </div>
    <div class="form-group form-group-margin">
      <label class="form-control-label-margin" for="password" style="font-weight: bold">Enter password</label>
      <div style="display: flex; align-items: center; position: relative; width: 100%;">
        <input type="password" class="form-control" id="password" th:field="*{password}"
               style="flex: 1; padding-right: 35px;">
        <span onclick="togglePassword()" id="togglePasswordIcon" class="fa fa-eye"
              style="position: absolute; right: 15px; cursor: pointer;"></span>
      </div>
      <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="invalid-validation"></div>
    </div>
    <div class="form-group form-group-margin">
      <label class="form-control-label-margin" for="locationZoneOffset" style="font-weight: bold">Choose a time zone</label>
      <select id="locationZoneOffset" class="form-control" th:field="*{locationZoneOffset}">
        <option th:each="timeZone : ${timeZones}"
                th:value="${timeZone}"
                th:text="${timeZone}">
        </option>
      </select>
      <div th:if="${#fields.hasErrors('locationZoneOffset')}" th:errors="*{locationZoneOffset}"
           class="invalid-validation"></div>
    </div>
    <button sec:authorize="hasAuthority('MANAGERS_CREATE')" type="submit" id="addButton"
            class="btn btn-success form-group-margin">Add
    </button>
    <a th:href="@{../../../ui/v1/managers}" class="btn btn-secondary form-group-margin"
       style="margin-left: 20px">Cancel</a>
  </form>
</div>
<footer th:insert="~{fragments/footer :: footer}"></footer>
<script type="text/javascript" th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.min.js}"></script>
<script th:src="@{/webjars/jquery-ui/1.13.2/jquery-ui.min.js}"></script>
<script th:inline="javascript">
  function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('togglePasswordIcon');

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleIcon.classList.remove('fa-eye');
      toggleIcon.classList.add('fa-eye-slash');
    } else {
      passwordInput.type = 'password';
      toggleIcon.classList.remove('fa-eye-slash');
      toggleIcon.classList.add('fa-eye');
    }
  }
</script>
</body>
</html>
