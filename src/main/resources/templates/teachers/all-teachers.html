<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0"/>
  <title>All Teachers - University CMS</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/tab-logo.svg}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:insert="~{fragments/header :: header}"></header>
<div class="container-fluid" style="max-width: 800px; margin: 0 auto;">
  <h2 class="title-center">Teachers</h2>
  <div class="my-3">
    <form th:action="@{/ui/v1/teachers}" id="searchForm">
      <div class="row d-flex">
        <div class="col-md-6 mt-2">
          <div class="search">
            <i class="fa fa-search"></i>
            <input id="keyword" type="search" name="keyword" th:value="${keyword}" required class="form-control"
                   placeholder="Enter teacher email">
            <button type="submit" class="btn btn-primary">Search</button>
          </div>
        </div>
        <div class="col-md-3 input-group mt-2">
          <div class="input-group-prepend">
            <label class="input-group-text" for="size">Items per page:</label>
          </div>
          <select form="searchForm" name="size" th:value="${size}" onchange="changePageSize()" class="size-select"
                  id="size">
            <option th:each="s : ${#numbers.sequence(1, 20)}" th:value="${s}" th:text="${s}"
                    th:selected="${s == size}"></option>
          </select>
        </div>
        <div class="col-md-3 mt-2 unsent-width">
          <button id="btnClear" class="btn btn-secondary">Clear</button>
        </div>
      </div>
    </form>
  </div>
  <div th:if="${teachers.size()} > 0">
    <table class="table table-striped table-hover table-responsive-xl">
      <thead class="table-light">
      <tr>
        <th scope="col">№</th>
        <th scope="col" style="text-align: left">Teacher name</th>
        <th scope="col" style="text-align: left">Email</th>
        <th scope="col">Status</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="teacher, interStat : ${teachers}">
        <th scope="row" th:text="${size * page + interStat.count}"></th>
        <td th:text="${teacher.firstName} + ' ' + ${teacher.lastName}" style="text-align: left"></td>
        <td th:text="${teacher.email}" style="text-align: left"></td>
        <td>
          <span th:if="${teacher.isActive}" class="fa-regular fa-square-check icon-dark" title="Active"></span>
          <span th:unless="${teacher.isActive}" class="far fa-times-circle icon-dark" title="Not active"></span>
        </td>
        <td>
          <a sec:authorize="hasAuthority('TEACHERS_READ')" aria-hidden="true" class="fa fa-eye icon-dark no-decoration"
             title="View this teacher" th:href="@{/ui/v1/teachers/{teacherId}(teacherId=${teacher.id})}"></a>
          <a sec:authorize="hasAuthority('SCHEDULE_READ')" class="fas fa-calendar-alt icon-dark" aria-hidden="true"
             th:href="@{/ui/v1/schedule/{scheduleId}(scheduleId=${teacher.scheduleId}, userId=${teacher.id},
             userFullName=${teacher.firstName + ' ' + teacher.lastName}, userRole=${teacher.roleName},
             userLocationZoneOffset=${teacher.locationZoneOffset})}"
             title="View the teacher's schedule" style="text-decoration: none; margin-left: 5px;"></a>
          <a sec:authorize="hasAuthority('TEACHERS_UPDATE')"
             th:href="@{/ui/v1/teachers/{teacherId}/edit(teacherId=${teacher.id})}" title="Update teacher info"
             class="fa-regular fa-pen-to-square icon-dark" style="text-decoration: none; margin-left: 5px;"></a>
          <span sec:authorize="hasAuthority('TEACHERS_DELETE')" class="fa-regular fa-trash-can icon-dark btn-delete"
                title="Delete this teacher" style="margin-left: 5px; cursor: pointer;" data-bs-toggle="modal"
                data-bs-target="#teacherDeleteModal" th:data-teacher-id="${teacher.id}"
                th:data-teacher-email="${teacher.email}"></span>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <div class="message info-m" th:unless="${teachers.size()} > 0">
    <span th:text="#{teachers.no.found}"></span>
  </div>
  <div class="my-3">
    <div class="row d-flex">
      <a sec:authorize="hasAuthority('TEACHERS_CREATE')" class="col-md-3 mt-2 unsent-width btn btn-success ms-auto"
         style="margin-right: 30px;" th:href="@{/ui/v1/teachers/new}">Add teacher</a>
    </div>
  </div>
  <div
    th:insert="~{fragments/pagination :: pagination('teachers', ${totalPages}, ${page}, ${size}, ${keyword})}"></div>
</div>
<div class="modal fade" id="teacherDeleteModal" tabindex="-1" aria-labelledby="teacherDeleteModalLabel"
     aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmModalLabel">Are you sure you want to delete this teacher?</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">By deleting this teacher, you will delete all his courses.</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <form th:method="delete" th:action="@{/ui/v1/teachers/teacherId/delete}">
          <button type="submit" class="btn btn-danger">Delete</button>
        </form>
      </div>
    </div>
  </div>
</div>
<footer th:insert="~{fragments/footer :: footer}"></footer>
<script type="text/javascript" th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.min.js}"></script>
<script th:src="@{/webjars/jquery-ui/1.13.2/jquery-ui.min.js}"></script>
<script type="text/javascript" th:src="@{/js/script.js}"></script>
<script th:inline="javascript">
  $(document).ready(function () {
    function clearAndRedirect(url) {
      $("#btnClear").on("click", function (e) {
        e.preventDefault();
        $("#keyword").text("");
        window.location = url;
      });
    }

    clearAndRedirect("/ui/v1/teachers");

    const allEmailsOfTeachers = /*[[${allEmailsOfTeachers}]]*/ [];

    $("#keyword").autocomplete({
      source: allEmailsOfTeachers
    });

    $('.btn-delete').click(function () {
      const teacherId = $(this).data('teacher-id');
      const teacherEmail = $(this).data('teacher-email');

      $('#teacherDeleteModal .modal-title').text(`Are you sure you want to delete a teacher with a ${teacherEmail} email?`);
      $('#teacherDeleteModal form').attr('action', `/ui/v1/teachers/${teacherId}/delete`);
    });
  });
</script>
</body>
</html>
